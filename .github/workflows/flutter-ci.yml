# Vérifie à chaque push que l'app compile : analyse statique, tests, puis
# APK universel (32 et 64 bits). L'APK est joint au résultat de l'exécution.
name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyse
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test --exclude-tags captures
      # Clé de signature stable : sans elle, chaque exécution signe avec une
      # clé de debug différente, et la connexion Google (liée à l'empreinte
      # SHA-1 de la clé) échoue. Secrets à définir dans le dépôt :
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
      # ANDROID_KEY_PASSWORD.
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Pas de clé configurée : signature de debug (connexion Google indisponible)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - name: APK universel
        # YELE_GOOGLE_CLIENT_ID : variable du dépôt (Settings → Variables).
        run: >
          flutter build apk --release
          --dart-define=YELE_GOOGLE_CLIENT_ID=${{ vars.YELE_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: yele-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
